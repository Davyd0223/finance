<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Wealthy — Кабинет</title>
    <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div class="container">
    <header class="topbar">
        <div class="brand">
            <div class="brand-badge" aria-hidden="true"></div>
            <div>
                <div class="brand-title">Wealthy</div>
                <div class="brand-sub">кабинет</div>
            </div>
        </div>
        <div class="auth">
            <a class="btn" href="/profile" role="button">Профиль</a>
            <a class="btn" href="/list" role="button">Списки</a>
            <form action="/auth/logout" method="post" style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="btn danger" type="submit">Выйти</button>
            </form>
        </div>
    </header>

    <main class="grid">
        <section class="card">
            <h2>Кошелек</h2>

            <!-- Выбор кошелька -->
            <form action="/app" method="get" style="margin-top:10px">
                <div class="row">
                    <div>
                        <label for="wallet-filter">Показать кошелек</label>
                        <select id="wallet-filter" name="walletId" onchange="this.form.submit()">
                            <option th:each="wallet : ${wallets}"
                                    th:value="${wallet.id}"
                                    th:text="${wallet.name}"
                                    th:selected="${wallet.id.equals(selectedWalletId)}">
                            </option>
                        </select>
                    </div>
                </div>
            </form>

            <div class="kpi" role="list">
                <div class="mini" role="listitem">
                    <div class="muted">Баланс</div>
                    <div class="value" th:text="${@format.money(balance, selectedWalletCurrency)}">0</div>
                </div>
                <div class="mini" role="listitem">
                    <div class="muted">Расходы</div>
                    <div class="value" th:text="${@format.money(expenses, selectedWalletCurrency)}">0</div>
                    <div class="pill warn"
                         th:text="'бюджет: ' + ${@format.money(budget, userCurrency)}">
                    </div>
                </div>
            </div>

            <div style="margin-top:16px">
                <h3 class="h3">История транзакций</h3>
                <table class="table" style="margin-top:10px">
                    <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Кошелек</th>
                        <th>Категория</th>
                        <th>Тип</th>
                        <th>Сумма</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="transaction : ${transactions}">
                        <td th:text="${#temporals.format(transaction.dateTime, 'yyyy-MM-dd HH:mm')}">-</td>
                        <td th:text="${transaction.wallet.name}">-</td>
                        <td><span class="pill" th:text="${transaction.category}">-</span></td>
                        <td>
                            <span class="pill"
                                  th:classappend="${transaction.kind.name() == 'INCOME'} ? 'ok' : 'warn'"
                                  th:text="${transaction.kind}">-</span>
                        </td>
                        <td th:text="${@format.money(transaction.amount, transaction.wallet.currency)}">-</td>
                        <td class="table-actions">
                            <a class="btn"
                               th:href="@{/transactions/{id}/edit(id=${transaction.id})}"
                               role="button">Редактировать</a>
                            <form th:action="@{/transactions/{id}/delete(id=${transaction.id})}"
                                  method="post" style="display:inline">
                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}"/>
                                <input type="hidden"
                                       name="walletId"
                                       th:value="${selectedWalletId != null ? selectedWalletId : 0}"/>
                                <button class="btn danger" type="submit">Удалить</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(transactions)}">
                        <td colspan="6" class="muted">Транзакций пока нет</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <aside class="card">
            <h2>Операция</h2>
            <form class="form" action="/transactions" method="post" autocomplete="off">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div>
                    <label for="op-wallet">Кошелек</label>
                    <select id="op-wallet" name="wallet_id" required>
                        <option th:each="wallet : ${wallets}"
                                th:value="${wallet.id}"
                                th:text="${wallet.name}"
                                th:selected="${selectedWalletId != 0 and wallet.id.equals(selectedWalletId)}">
                        </option>
                    </select>
                </div>

                <div class="row">
                    <div>
                        <label for="op-kind">Тип</label>
                        <select id="op-kind" name="kind" required>
                            <option th:each="kind : ${kinds}"
                                    th:value="${kind}"
                                    th:text="${kind}">
                            </option>
                        </select>
                    </div>
                    <div>
                        <label for="op-amount">Сумма</label>
                        <input id="op-amount" name="amount"
                               placeholder="Напр. 1990"
                               inputmode="decimal" required/>
                    </div>
                </div>

                <div class="row">
                    <div>
                        <label for="op-category">Категория</label>
                        <select id="op-category" name="category" required>
                            <option th:each="category : ${categories}"
                                    th:value="${category}"
                                    th:text="${category}">
                            </option>
                        </select>
                    </div>
                    <div>
                        <label for="op-date_time">Дата и время</label>
                        <input id="op-date_time" name="date_time"
                               type="datetime-local" required/>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn primary" type="submit">Сохранить</button>
                    <button class="btn" type="reset">Очистить</button>
                </div>
            </form>
        </aside>
    </main>
</div>
<div th:replace="~{fragments/toast :: toasts}"></div>
<script th:replace="~{fragments/toast :: toastScript}"></script>
</body>
</html>
