<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Wealthy — Профиль</title>
    <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div class="container">
    <header class="topbar">
        <div class="brand">
            <div class="brand-badge" aria-hidden="true"></div>
            <div>
                <div class="brand-title">Wealthy</div>
                <div class="brand-sub">профиль</div>
            </div>
        </div>
        <div class="auth">
            <a class="btn" href="/app" role="button">В кабинет</a>
            <form action="/auth/logout" method="post" style="display:inline">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button class="btn danger" type="submit">Выйти</button>
            </form>
        </div>
    </header>

    <main class="grid" style="margin-top:18px; grid-template-columns: 1fr;">
        <section class="card">
            <h2>Настройки профиля</h2>
            <div class="muted">Email и пароль изменить нельзя.</div>

            <form class="form" action="/profile" method="post"
                  autocomplete="on" style="margin-top:12px">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div>
                    <label for="p-email">Email</label>
                    <input id="p-email"
                           th:value="${user.email}"
                           disabled
                           style="opacity: 0.5"/>
                </div>

                <div>
                    <label for="p-name">Имя</label>
                    <input id="p-name"
                           name="name"
                           th:value="${user.name}"
                           placeholder="Ваше имя"
                           required/>
                </div>

                <div>
                    <label for="p-budget">Месячный бюджет</label>
                    <input id="p-budget"
                           name="defaultMonthlyBudget"
                           inputmode="decimal"
                           th:value="${user.defaultMonthlyBudget}"
                           placeholder="0"
                           required/>
                </div>

                <div class="actions">
                    <button class="btn primary" type="submit">Сохранить</button>
                    <a class="btn" href="/app" role="button">Отмена</a>
                </div>
            </form>
        </section>
    </main>
</div>
<div th:replace="~{fragments/toast :: toasts}"></div>
<script th:replace="~{fragments/toast :: toastScript}"></script>
</body>
</html>
