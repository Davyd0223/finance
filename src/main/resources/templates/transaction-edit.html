<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Wealthy — Редактирование транзакции</title>
    <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div class="container">
    <header class="topbar">
        <div class="brand">
            <div class="brand-badge" aria-hidden="true"></div>
            <div>
                <div class="brand-title">Wealthy</div>
                <div class="brand-sub">редактирование транзакции</div>
            </div>
        </div>
        <div class="auth">
            <a class="btn" href="/app" role="button">Назад</a>
            <form action="/auth/logout" method="post" style="display:inline">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button class="btn danger" type="submit">Выйти</button>
            </form>
        </div>
    </header>

    <main class="grid" style="margin-top:18px">
        <section class="card">
            <h2>Редактировать транзакцию</h2>
            <div class="muted">Измените нужные поля и нажмите сохранить.</div>

            <form class="form"
                  th:action="@{/transactions/{id}/edit(id=${transaction.id})}"
                  method="post"
                  autocomplete="off"
                  style="margin-top:12px">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <!-- Кошелек -->
                <div>
                    <label for="edit-wallet">Кошелек</label>
                    <select id="edit-wallet" name="wallet_id" required>
                        <option th:each="wallet : ${wallets}"
                                th:value="${wallet.id}"
                                th:text="${wallet.name}"
                                th:selected="${wallet.id == transaction.wallet.id}">
                        </option>
                    </select>
                </div>

                <div class="row">
                    <!-- Тип операции -->
                    <div>
                        <label for="edit-kind">Тип</label>
                        <select id="edit-kind" name="kind" required>
                            <option th:each="kind : ${kinds}"
                                    th:value="${kind}"
                                    th:text="${kind}"
                                    th:selected="${kind == transaction.kind}">
                            </option>
                        </select>
                    </div>

                    <!-- Сумма -->
                    <div>
                        <label for="edit-amount">Сумма</label>
                        <input id="edit-amount"
                               name="amount"
                               inputmode="decimal"
                               th:value="${transaction.amount}"
                               required/>
                    </div>
                </div>

                <div class="row">
                    <!-- Категория -->
                    <div>
                        <label for="edit-category">Категория</label>
                        <select id="edit-category" name="category" required>
                            <option th:each="category : ${categories}"
                                    th:value="${category}"
                                    th:text="${category}"
                                    th:selected="${category == transaction.category}">
                            </option>
                        </select>
                    </div>

                    <!-- Дата и время -->
                    <div>
                        <label for="edit-date_time">Дата и время</label>
                        <input id="edit-date_time"
                               name="date_time"
                               type="datetime-local"
                               th:value="${#temporals.format(transaction.dateTime, 'yyyy-MM-dd''T''HH:mm')}"
                               required/>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn primary" type="submit">Сохранить</button>
                    <a class="btn" href="/app" role="button">Отмена</a>
                    <!-- Удаление прямо со страницы редактирования -->
                    <form th:action="@{/transactions/{id}/delete(id=${transaction.id})}"
                          method="post"
                          style="display:inline">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}"/>
                        <button class="btn danger" type="submit">Удалить</button>
                    </form>
                </div>
            </form>
        </section>
    </main>
</div>
<div th:replace="~{fragments/toast :: toasts}"></div>
<script th:replace="~{fragments/toast :: toastScript}"></script>
</body>
</html>
