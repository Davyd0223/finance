<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Wealthy — Списки</title>
    <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div class="container">
    <header class="topbar">
        <div class="brand">
            <div class="brand-badge" aria-hidden="true"></div>
            <div>
                <div class="brand-title">Wealthy</div>
                <div class="brand-sub">списки</div>
            </div>
        </div>
        <div class="auth">
            <a class="btn" href="/app" role="button">В кабинет</a>
            <form action="/auth/logout" method="post" style="display:inline">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>
                <button class="btn danger" type="submit">Выйти</button>
            </form>
        </div>
    </header>

    <main class="grid" style="margin-top:18px; grid-template-columns: 1fr;">

        <!-- Профиль пользователя -->
        <section class="card">
            <h2>Профиль</h2>
            <table class="table" style="margin-top:12px">
                <thead>
                <tr>
                    <th>Имя</th>
                    <th>Email</th>
                    <th>Валюта</th>
                    <th>Месячный бюджет</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td th:text="${user.name}">-</td>
                    <td th:text="${user.email}">-</td>
                    <td><span class="pill" th:text="${user.defaultCurrency}">-</span></td>
                    <td th:text="${@format.money(user.defaultMonthlyBudget, user.defaultCurrency)}">-</td>
                </tr>
                </tbody>
            </table>
        </section>

        <!-- Создание кошелька -->
        <section class="card">
            <h2>Создать кошелек</h2>

            <form class="form" action="/wallets" method="post" autocomplete="off" style="margin-top:12px">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}"/>

                <div>
                    <label for="wallet-name">Название</label>
                    <input id="wallet-name" name="name" placeholder="Напр. Основная карта" required/>
                </div>

                <div class="row">
                    <div>
                        <label for="wallet-currency">Валюта</label>
                        <select id="wallet-currency" name="currency" required>
                            <option th:each="currency : ${currencies}"
                                    th:value="${currency}"
                                    th:text="${currency}">
                            </option>
                        </select>
                    </div>

                    <div>
                        <label for="wallet-type">Тип</label>
                        <select id="wallet-type" name="type" required>
                            <option th:each="walletType : ${walletTypes}"
                                    th:value="${walletType}"
                                    th:text="${walletType}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="actions">
                    <button class="btn primary" type="submit">Создать кошелек</button>
                </div>
            </form>
        </section>

        <!-- Кошельки -->
        <section class="card">
            <h2>Кошельки</h2>
            <table class="table" style="margin-top:12px">
                <thead>
                <tr>
                    <th>Название</th>
                    <th>Валюта</th>
                    <th>Тип</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="wallet : ${wallets}">
                    <td th:text="${wallet.name}">-</td>
                    <td><span class="pill" th:text="${wallet.currency}">-</span></td>
                    <td><span class="pill" th:text="${wallet.type}">-</span></td>
                    <td class="table-actions">
                        <form th:action="@{/wallets/{id}/delete(id=${wallet.id})}"
                              method="post" style="display:inline">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <button class="btn danger" type="submit">Удалить</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(wallets)}">
                    <td colspan="4" class="muted">Кошельков нет</td>
                </tr>
                </tbody>
            </table>
        </section>

        <!-- Транзакции -->
        <section class="card">
            <h2>Транзакции</h2>
            <table class="table" style="margin-top:12px">
                <thead>
                <tr>
                    <th>Кошелек</th>
                    <th>Категория</th>
                    <th>Дата</th>
                    <th>Сумма</th>
                    <th>Тип</th>
                    <th>Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="transaction : ${transactions}">
                    <td th:text="${transaction.wallet.name}">-</td>
                    <td th:text="${transaction.category}">-</td>
                    <td th:text="${#temporals.format(transaction.dateTime, 'yyyy-MM-dd HH:mm')}">-</td>
                    <td th:text="${@format.money(transaction.amount, transaction.wallet.currency)}">-</td>
                    <td>
                        <span class="pill"
                              th:classappend="${transaction.kind.name() == 'INCOME'} ? 'ok' : 'warn'"
                              th:text="${transaction.kind}">-</span>
                    </td>
                    <td class="table-actions">
                        <a class="btn"
                           th:href="@{/transactions/{id}/edit(id=${transaction.id})}"
                           role="button">Редактировать</a>
                        <form th:action="@{/transactions/{id}/delete(id=${transaction.id})}"
                              method="post" style="display:inline">
                            <input type="hidden"
                                   th:name="${_csrf.parameterName}"
                                   th:value="${_csrf.token}"/>
                            <input type="hidden" name="returnTo" value="list"/>
                            <button class="btn danger" type="submit">Удалить</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(transactions)}">
                    <td colspan="6" class="muted">Транзакций нет</td>
                </tr>
                </tbody>
            </table>
        </section>

    </main>
</div>
<div th:replace="~{fragments/toast :: toasts}"></div>
<script th:replace="~{fragments/toast :: toastScript}"></script>
</body>
</html>
